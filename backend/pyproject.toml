[project]
name = "coi-backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1",
    "gunicorn>=23",
    "kreuzberg==4.10.4",
    "filetype>=1.2",
    "openai>=1.60",
    "pillow>=11",
    "apiflask>=3.1.3",
    "pyjwt[crypto]>=2.15.1",
    "jsonschema>=4.26.0",
    "rapidfuzz>=3.14.6",
    "sqlalchemy>=2.0",
    "pydantic>=2.14.4",
]

[dependency-groups]
dev = [
    "babel>=2.18.0",
    "certifi>=2026.11.20",
    "phonenumbers>=9.0.44",
    "pytest>=8",
]

[tool.pytest.ini_options]
markers = ["eden: calls the Eden LLM API (costs money; skip with -m 'not eden')"]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
